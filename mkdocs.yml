site_name: Sourcery Documentation
site_description: Sourcery is a Python LLM extraction framework for converting text, PDFs, URLs, HTML, and VLM OCR image sources into typed, source-grounded Pydantic data with JSONL and HTML review workflows.
site_url: !ENV [SITE_URL, "https://jolovicdev.github.io/sourcery/"]
repo_url: !ENV [REPO_URL, "https://github.com/jolovicdev/sourcery"]
repo_name: sourceryforge

theme:
  name: readthedocs

plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: >
        Sourcery is a Python LLM extraction framework for converting unstructured text,
        PDFs, URLs, HTML, and VLM OCR image sources into typed, source-grounded Pydantic data with
        async extraction, streaming chunk events, traceability, and reviewable output.
      sections:
        Getting Started:
          - index.md: Documentation home for schema-first LLM document extraction.
          - getting-started/installation.md: Install Sourcery, optional extras, and provider credentials.
          - getting-started/quickstart.md: Run typed LLM extraction with JSONL and HTML outputs.
        Guides:
          - guides/build-a-pipeline.md: Mixed-source extraction pipeline workflow.
          - guides/code-examples.md: Runnable Python examples for extraction, ingestion, streaming, IO, and benchmarking.
          - guides/usage.md: End-to-end Sourcery usage reference and API patterns.
          - guides/runtime-and-tuning.md: Runtime controls, async extraction, streaming, retries, and tuning profiles.
          - guides/ingestion.md: Load text, PDFs, URLs, HTML, and VLM OCR image sources.
          - guides/outputs-and-reviewer.md: JSONL persistence, HTML viewer, and reviewer workflows.
          - guides/benchmarking.md: Benchmark CLI usage and output format.
          - guides/testing-and-validation.md: Test, lint, and type-check commands.
        Architecture:
          - architecture/system-overview.md: Module boundaries and execution flow.
          - architecture/pipeline-internals.md: Chunking, alignment, merge, and prompt internals.
          - architecture/runtime-internals.md: Engine/runtime orchestration internals.
        Reference:
          - reference/public-api.md: Public exports, top-level API surface, and streaming entry points.
          - reference/data-contracts.md: Pydantic contract, schema, result, and stream event reference.
          - reference/error-model.md: Exception hierarchy and error handling model.
          - reference/file-by-file-map.md: File-level responsibilities across modules.

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guides:
      - Build a Pipeline: guides/build-a-pipeline.md
      - Code Examples: guides/code-examples.md
      - Usage: guides/usage.md
      - Runtime and Tuning: guides/runtime-and-tuning.md
      - Ingestion: guides/ingestion.md
      - Outputs and Reviewer: guides/outputs-and-reviewer.md
      - Benchmarking: guides/benchmarking.md
      - Testing and Validation: guides/testing-and-validation.md
  - Architecture:
      - System Overview: architecture/system-overview.md
      - Pipeline Internals: architecture/pipeline-internals.md
      - Runtime Internals: architecture/runtime-internals.md
  - Reference:
      - Public API: reference/public-api.md
      - Data Contracts: reference/data-contracts.md
      - Error Model: reference/error-model.md
      - File-by-File Map: reference/file-by-file-map.md

markdown_extensions:
  - toc:
      permalink: "#"
  - tables
  - fenced_code
